alias: "EV: Deadline Charge - Revert After Deadline"
description: >
  Fires shortly after the 07:00 deadline to hand back to normal
  opportunistic charging and clear the active flag.
triggers:
  - trigger: time
    at: "07:15:00"
conditions:
  - condition: state
    entity_id: input_boolean.ev_deadline_charge_active
    state: "on"
actions:
  - action: select.select_option
    target:
      entity_id: select.ohme_home_pro_delta_11kw_charge_mode
    data:
      option: smart_charge
  - action: input_boolean.turn_off
    target:
      entity_id: input_boolean.ev_deadline_charge_active
mode: single
