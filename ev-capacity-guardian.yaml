alias: "EV: Capacity Guardian"
description: >
  SINGLE SOURCE OF TRUTH: Protects the 6kW monthly capacity peak and handles 
  the evening dinner lockout.
  
  Logic:
  1. PAUSE if house load > 6.5kW for 5 mins (prevents 15-min average > 6kW).
  2. PAUSE during dinner window (18:30 - 20:45).
  3. RESUME when house load is < 4.0kW for 10 mins.
  4. RESUME at 06:00 (safety check for morning departure).

triggers:
  # --- PAUSE TRIGGERS ---
  - trigger: numeric_state
    entity_id: sensor.p1_meter_active_power
    above: 6.5
    for:
      minutes: 5
    id: "pause_load_high"
  
  - trigger: time
    at: "18:15:00"
    id: "pause_lockout_start"

  # --- RESUME TRIGGERS ---
  - trigger: numeric_state
    entity_id: sensor.p1_meter_active_power
    below: 4.0
    for:
      minutes: 10
    id: "resume_load_low"

  - trigger: time
    at: "20:00:00"
    id: "resume_lockout_end"

  - trigger: time
    at: "06:00:00"
    id: "resume_morning"

conditions: []

actions:
  - choose:
      # ACTION: PAUSE
      - conditions:
          - condition: or
            conditions:
              - condition: trigger
                id: "pause_load_high"
              - condition: trigger
                id: "pause_lockout_start"
        sequence:
          - action: select.select_option
            target:
              entity_id: select.ohme_home_pro_delta_11kw_charge_mode
            data:
              option: paused
          - action: notify.mobile_app_pixel_10
            data:
              title: "EV Paused"
              message: "[{{ now().strftime('%H:%M') }}] Reason: {{ 'High House Load' if trigger.id == 'pause_load_high' else 'Dinner Lockout' }}. Protecting your 6kW peak."
              data:
                priority: high
                ttl: 0
                importance: high
          - action: notify.mobile_app_pixel_8
            data:
              title: "EV Paused"
              message: "[{{ now().strftime('%H:%M') }}] Reason: {{ 'High House Load' if trigger.id == 'pause_load_high' else 'Dinner Lockout' }}. Protecting your 6kW peak."
              data:
                priority: high
                ttl: 0
                importance: high

      # ACTION: RESUME
      - conditions:
          - condition: or
            conditions:
              - condition: trigger
                id: "resume_load_low"
              - condition: trigger
                id: "resume_lockout_end"
              - condition: trigger
                id: "resume_morning"
          # Don't resume if we are still in the dinner window
          - condition: time
            after: "20:00:00"
            before: "18:15:00"
          # Don't resume if the car is unplugged
          - condition: not
            conditions:
              - condition: state
                entity_id: sensor.ohme_home_pro_delta_11kw_status
                state: "unplugged"
        sequence:
          - action: select.select_option
            target:
              entity_id: select.ohme_home_pro_delta_11kw_charge_mode
            data:
              option: smart_charge

mode: single
