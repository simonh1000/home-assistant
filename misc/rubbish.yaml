template:
  - sensor:
      - name: "Next Rubbish Collection"
        state: >
          {% set collection = state_attr('calendar.rubbish', 'start_time') %}
          {{collection}}
          {% if collection %}
            {{ as_datetime(collection).strftime('%A, %b %d') }}
          
          {% endif %}
        icon: mdi:recycle

