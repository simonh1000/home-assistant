alias: "EV: Approval Reminder (22:30)"
description: >
  Sends a 22:30 safety-net reminder if an EV charge is still sitting
  unapproved (in case the Ohme app notification was missed during the day).

variables:
  ohme_vehicle: "{{ states('select.ohme_home_pro_delta_11kw_vehicle') }}"

triggers:
  - trigger: time
    at: "22:30:00"

conditions:
  - condition: state
    entity_id: sensor.ohme_home_pro_delta_11kw_status
    state: "pending_approval"

actions:
  - action: notify.mobile_app_pixel_10
    data:
      title: "EV Charge Still Needs Approval"
      message: >
        [{{ now().strftime('%H:%M') }}] Charge pending for {{ ohme_vehicle }} is still waiting for approval.
      data:
        priority: high
        ttl: 0
        importance: high
        actions:
          - action: "OHME_APPROVE"
            title: "Approve"
  - action: notify.mobile_app_pixel_8
    data:
      title: "EV Charge Still Needs Approval"
      message: >
        [{{ now().strftime('%H:%M') }}] Charge pending for {{ ohme_vehicle }} is still waiting for approval.
      data:
        priority: high
        ttl: 0
        importance: high
        actions:
          - action: "OHME_APPROVE"
            title: "Approve"

mode: single