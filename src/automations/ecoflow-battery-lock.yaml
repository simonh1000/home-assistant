id: ecoflow_battery_lock
alias: "EcoFlow: Battery Lock on EV Charge Start"
description: |
  Prevents the car from draining the EcoFlow home battery: when the Ohme
  starts charging, switches the EcoFlow integration to "Hold battery", so the
  car draws only from solar/grid while charging.

  Note: if Home Assistant restarts mid-charge, this won't re-trigger (no new
  'to: charging' transition). The integration stops sending its heartbeat
  while HA is down, so the inverter reverts to the app's control on its own.
triggers:
  - trigger: state
    entity_id: sensor.ohme_home_pro_delta_11kw_status
    to: "charging"
conditions: []
actions:
  - action: script.ecoflow_lock_battery
mode: single
