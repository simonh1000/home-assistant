id: peak_alert
alias: "Peak Alert: Warning Only"
description: >
  NOTIFICATION ONLY: Sends a warning to your phone if the house load 
  exceeds 6.0kW for 2 minutes. This provides awareness without 
  automatically changing any charger states.
triggers:
  - trigger: numeric_state
    entity_id: sensor.p1_meter_active_power
    above: 6.0
    for:
      minutes: 2
actions:
  - action: script.notify_both_phones
    data:
      title: "Peak Warning: 6kW Exceeded"
      message: "[{{ now().strftime('%H:%M') }}] House load is currently {{ states('sensor.p1_meter_active_power') }}kW. Average peak risk!"
mode: single
