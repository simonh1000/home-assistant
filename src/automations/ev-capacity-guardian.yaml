id: ev_capacity_guardian
alias: "EV: Capacity Guardian"
description: |
  DISABLED: keeps firing incorrectly, logic needs rethinking before re-enabling.

  Makes the EV yield to sustained house load and reserves the dinner period.
  Requires input_select.ev_guardian_state (idle, yielding, cooldown) and
  input_boolean.ev_cooking_over. Uses sensor.p1_meter_power in Watts.
# DISABLED: keeps firing incorrectly, logic needs rethinking before re-enabling.
initial_state: false

variables:
  ohme_state: "{{ states('sensor.ohme_home_pro_delta_11kw_status') }}"
  guardian_state: "{{ states('input_select.ev_guardian_state') }}"
  cooking_over: "{{ is_state('input_boolean.ev_cooking_over', 'on') }}"

triggers:
  - trigger: numeric_state
    entity_id: sensor.p1_meter_power
    above: 6000
    for: { seconds: 30 }
    id: "high_load"
  - trigger: numeric_state
    entity_id: sensor.p1_meter_power
    below: 500
    for: { minutes: 2 }
    id: "quiet_house"
  - trigger: numeric_state
    entity_id: sensor.p1_meter_power
    above: 800
    for: { seconds: 15 }
    id: "house_no_longer_quiet"
  - trigger: time
    at: "18:15:00"
    id: "dinner_check"
  - trigger: state
    entity_id: sensor.ohme_home_pro_delta_11kw_status
    to: "charging"
    id: "dinner_check"
  - trigger: time
    at: "20:00:00"
    id: "dinner_end"
  - trigger: time_pattern
    seconds: "/30"
    id: "resume_check"
  - trigger: time
    at: "22:30:00"
    id: "safety_net"

conditions: []

actions:
  - choose:
      # 1. High house load collision: pause EV and move to YIELDING
      - conditions:
          - condition: trigger
            id: "high_load"
          - condition: state
            entity_id: sensor.ohme_home_pro_delta_11kw_status
            state: "charging"
        sequence:
          - action: select.select_option
            target: { entity_id: select.ohme_home_pro_delta_11kw_charge_mode }
            data: { option: paused }
          - action: select.select_option
            target: { entity_id: input_select.ev_guardian_state }
            data: { option: yielding }
          - action: script.notify_both_phones
            data:
              title: "EV Paused"
              message: |
                [{{ now().strftime('%H:%M') }}] House load stayed above 6.0kW
                for 30 seconds. EV paused to yield to the house.

      # 2. High load notification (EV not charging)
      - conditions:
          - condition: trigger
            id: "high_load"
        sequence:
          - action: script.notify_both_phones
            data:
              title: "High Load — Not the EV"
              message: |
                [{{ now().strftime('%H:%M') }}] House load stayed above 6.0kW
                for 30 seconds while the EV was not charging (status: {{ ohme_state }}).

      # 3. Dinner lockout (18:15 - 20:00)
      - conditions:
          - condition: trigger
            id: "dinner_check"
          - condition: time
            after: "18:15:00"
            before: "20:00:00"
          - condition: state
            entity_id: sensor.ohme_home_pro_delta_11kw_status
            state: "charging"
          - condition: state
            entity_id: input_boolean.ev_cooking_over
            state: "off"
        sequence:
          - action: select.select_option
            target: { entity_id: select.ohme_home_pro_delta_11kw_charge_mode }
            data: { option: paused }
          - action: script.notify_both_phones
            data:
              title: "EV Paused"
              message: "[{{ now().strftime('%H:%M') }}] Paused for the dinner window."

      # 4. Yielding -> Cooldown: set to cooldown after 2 mins under 500W
      - conditions:
          - condition: trigger
            id: "quiet_house"
          - condition: state
            entity_id: input_select.ev_guardian_state
            state: "yielding"
        sequence:
          - action: select.select_option
            target: { entity_id: input_select.ev_guardian_state }
            data: { option: cooldown }
          - action: script.notify_simon
            data:
              title: "House Quiet"
              message: "[{{ now().strftime('%H:%M') }}] House draw dropped below 500W for 2 minutes. Cooling down..."

      # 5. Cooldown -> Yielding: house load rises again
      - conditions:
          - condition: trigger
            id: "house_no_longer_quiet"
          - condition: state
            entity_id: input_select.ev_guardian_state
            state: "cooldown"
        sequence:
          - action: select.select_option
            target: { entity_id: input_select.ev_guardian_state }
            data: { option: yielding }

      # 6. Dinner window end: resume EV if at idle (i.e. not yielding/cooldown)
      - conditions:
          - condition: trigger
            id: "dinner_end"
          - condition: state
            entity_id: input_select.ev_guardian_state
            state: "idle"
          - condition: state
            entity_id: sensor.ohme_home_pro_delta_11kw_status
            state: "paused"
        sequence:
          - action: select.select_option
            target: { entity_id: select.ohme_home_pro_delta_11kw_charge_mode }
            data: { option: smart_charge }
          - action: input_boolean.turn_off
            target: { entity_id: input_boolean.ev_cooking_over }

      # 7. Collision recovery: resume after 10m total state time
      - conditions:
          - condition: trigger
            id: "resume_check"
          - condition: template
            value_template: "{{ guardian_state != 'idle' }}"
          - condition: time
            after: "20:00:00"
            before: "18:15:00"
          - condition: template
            value_template: >
              {{ (as_timestamp(now()) -
                  as_timestamp(states.input_select.ev_guardian_state.last_changed))
                  >= 600 }}
          - condition: state
            entity_id: sensor.ohme_home_pro_delta_11kw_status
            state: "paused"
        sequence:
          - action: select.select_option
            target: { entity_id: select.ohme_home_pro_delta_11kw_charge_mode }
            data: { option: smart_charge }
          - action: select.select_option
            target: { entity_id: input_select.ev_guardian_state }
            data: { option: idle }
          - action: input_boolean.turn_off
            target: { entity_id: input_boolean.ev_cooking_over }
          - action: script.notify_both_phones
            data:
              title: "EV Resumed"
              message: |
                [{{ now().strftime('%H:%M') }}] House has been quiet and the
                Guardian minimum pause has elapsed.

      # 8. Safety net: force resume by 22:30
      - conditions:
          - condition: trigger
            id: "safety_net"
          - condition: state
            entity_id: sensor.ohme_home_pro_delta_11kw_status
            state: "paused"
        sequence:
          - action: select.select_option
            target: { entity_id: select.ohme_home_pro_delta_11kw_charge_mode }
            data: { option: smart_charge }
          - action: select.select_option
            target: { entity_id: input_select.ev_guardian_state }
            data: { option: idle }
          - action: input_boolean.turn_off
            target: { entity_id: input_boolean.ev_cooking_over }
mode: single
