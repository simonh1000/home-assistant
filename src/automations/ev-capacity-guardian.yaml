id: ev_capacity_guardian
alias: "EV: Capacity Guardian"
description: |
  Makes the EV yield to sustained house load and reserves the dinner period.
  Uses 4-state input_select.ev_guardian_state (idle, cooking, yielding, cooldown).
  Uses sensor.p1_meter_power in Watts.

# Template-only copies of two states, for use inside {{ ... }}. (A
# `condition: state` can't take a variable, so those name the entity directly.)
#   - ohme_state, guardian_state: the "High Load — Not the EV" notification text
#   - guardian_state: the resume_check "in [yielding, cooldown]" test
#
# These are SNAPSHOTS, not live values: each is read once when the automation
# starts and then never updates during that run. Example: if resume_check sets
# ev_guardian_state to idle, a later {{ guardian_state }} in the same run still
# says "yielding". Use {{ states('input_select.ev_guardian_state') }} instead if
# you ever need the current value part-way through.
variables:
  ohme_state: "{{ states('sensor.ohme_home_pro_delta_11kw_status') }}"
  guardian_state: "{{ states('input_select.ev_guardian_state') }}"

triggers:
  - trigger: numeric_state
    entity_id: sensor.p1_meter_power
    above: 6000
    for: { seconds: 30 }
    id: "high_load"
  - trigger: numeric_state
    entity_id: sensor.p1_meter_power
    below: 500
    for: { minutes: 2 }
    id: "quiet_house"
  - trigger: numeric_state
    entity_id: sensor.p1_meter_power
    above: 800
    for: { seconds: 15 }
    id: "house_no_longer_quiet"
  - trigger: time
    at: "18:15:00"
    id: "dinner_check"
  - trigger: state
    entity_id: sensor.ohme_home_pro_delta_11kw_status
    to: "charging"
    id: "dinner_check"
  - trigger: time
    at: "20:15:00"
    id: "dinner_end"
  - trigger: time_pattern
    seconds: "/30"
    id: "resume_check"
  - trigger: time
    at: "22:30:00"
    id: "safety_net"

conditions: []

actions:
  - choose:
      # high_load: High house load collision: pause EV and move to YIELDING (only when idle)
      - conditions:
          - condition: trigger
            id: "high_load"
          - condition: state
            entity_id: input_select.ev_guardian_state
            state: "idle"
          - condition: state
            entity_id: sensor.ohme_home_pro_delta_11kw_status
            state: "charging"
        sequence:
          - action: select.select_option
            target: { entity_id: select.ohme_home_pro_delta_11kw_charge_mode }
            data: { option: paused }
          - action: select.select_option
            target: { entity_id: input_select.ev_guardian_state }
            data: { option: yielding }
          - action: script.notify_both_phones
            data:
              title: "EV Paused"
              message: |
                [{{ now().strftime('%H:%M') }}] House load stayed above 6.0kW
                for 30 seconds. EV paused to yield to the house.

      # high_load: High load notification (EV not charging / not idle)
      - conditions:
          - condition: trigger
            id: "high_load"
        sequence:
          - action: script.notify_both_phones
            data:
              title: "High Load — Not the EV"
              message: |
                [{{ now().strftime('%H:%M') }}] House load stayed above 6.0kW
                for 30 seconds while the EV was not charging (status: {{ ohme_state }}, guardian: {{ guardian_state }}).

      # dinner_check 1: transition idle/yielding/cooldown -> cooking; turn off car charging
      - conditions:
          - condition: trigger
            id: "dinner_check"
          - condition: time
            after: "18:15:00"
            before: "20:15:00"
          - condition: state
            entity_id: input_select.ev_guardian_state
            state: ["idle", "yielding", "cooldown"]
        sequence:
          - action: select.select_option
            target: { entity_id: input_select.ev_guardian_state }
            data: { option: cooking }
          - choose:
              # turn off car if charging and notify
              - conditions:
                  - condition: state
                    entity_id: sensor.ohme_home_pro_delta_11kw_status
                    state: "charging"
                sequence:
                  - action: select.select_option
                    target: { entity_id: select.ohme_home_pro_delta_11kw_charge_mode }
                    data: { option: paused }
                  - action: script.notify_both_phones
                    data:
                      title: "EV Paused"
                      message: "[{{ now().strftime('%H:%M') }}] Paused for the dinner window."

      # dinner_check 2: Car tries to start charging during cooking period => pause and notify
      - conditions:
          - condition: trigger
            id: "dinner_check"
          - condition: state
            entity_id: input_select.ev_guardian_state
            state: "cooking"
          - condition: state
            entity_id: sensor.ohme_home_pro_delta_11kw_status
            state: "charging"
        sequence:
          - action: select.select_option
            target: { entity_id: select.ohme_home_pro_delta_11kw_charge_mode }
            data: { option: paused }
          - action: script.notify_both_phones
            data:
              title: "EV Paused"
              message: "[{{ now().strftime('%H:%M') }}] EV plugged in during dinner window — Paused for cooking."

      # quiet_house: Yielding -> Cooldown: set to cooldown after 2 mins under 500W
      - conditions:
          - condition: trigger
            id: "quiet_house"
          - condition: state
            entity_id: input_select.ev_guardian_state
            state: "yielding"
        sequence:
          - action: select.select_option
            target: { entity_id: input_select.ev_guardian_state }
            data: { option: cooldown }
          - action: script.notify_simon
            data:
              title: "House Quiet"
              message: "[{{ now().strftime('%H:%M') }}] House draw dropped below 500W for 2 minutes. Cooling down..."

      # house_no_longer_quiet: Cooldown -> Yielding: house load rises again
      - conditions:
          - condition: trigger
            id: "house_no_longer_quiet"
          - condition: state
            entity_id: input_select.ev_guardian_state
            state: "cooldown"
        sequence:
          - action: select.select_option
            target: { entity_id: input_select.ev_guardian_state }
            data: { option: yielding }

      # dinner_end: transition cooking -> idle
      - conditions:
          - condition: trigger
            id: "dinner_end"
          - condition: state
            entity_id: input_select.ev_guardian_state
            state: "cooking"
        sequence:
          - action: select.select_option
            target: { entity_id: input_select.ev_guardian_state }
            data: { option: idle }
          - choose:
              # turn on car if paused and notify
              - conditions:
                  - condition: state
                    entity_id: sensor.ohme_home_pro_delta_11kw_status
                    state: "paused"
                sequence:
                  - action: select.select_option
                    target: { entity_id: select.ohme_home_pro_delta_11kw_charge_mode }
                    data: { option: smart_charge }
                  - action: script.notify_both_phones
                    data:
                      title: "EV Resumed"
                      message: "[{{ now().strftime('%H:%M') }}] Dinner window ended — EV charging resumed."

      # resume_check: Collision recovery: resume after 10m total state time
      - conditions:
          - condition: trigger
            id: "resume_check"
          - condition: template
            value_template: "{{ guardian_state in ['yielding', 'cooldown'] }}"
          - condition: time
            after: "20:15:00"
            before: "18:15:00"
          - condition: template
            value_template: >
              {{ (as_timestamp(now()) -
                  as_timestamp(states.input_select.ev_guardian_state.last_changed))
                  >= 600 }}
          - condition: state
            entity_id: sensor.ohme_home_pro_delta_11kw_status
            state: "paused"
        sequence:
          - action: select.select_option
            target: { entity_id: select.ohme_home_pro_delta_11kw_charge_mode }
            data: { option: smart_charge }
          - action: select.select_option
            target: { entity_id: input_select.ev_guardian_state }
            data: { option: idle }
          - action: script.notify_both_phones
            data:
              title: "EV Resumed"
              message: |
                [{{ now().strftime('%H:%M') }}] House has been quiet and the
                Guardian minimum pause has elapsed.

      # safety_net: Safety net: force resume by 22:30
      - conditions:
          - condition: trigger
            id: "safety_net"
        sequence:
          - action: select.select_option
            target: { entity_id: input_select.ev_guardian_state }
            data: { option: idle }
          - choose:
              - conditions:
                  - condition: state
                    entity_id: sensor.ohme_home_pro_delta_11kw_status
                    state: "paused"
                sequence:
                  - action: select.select_option
                    target: { entity_id: select.ohme_home_pro_delta_11kw_charge_mode }
                    data: { option: smart_charge }
mode: single
