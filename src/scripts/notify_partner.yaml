notify_partner:
  alias: "Notify Partner"
  fields:
    title:
      example: "EV Paused"
    message:
      example: "Something happened"
  sequence:
    - action: notify.mobile_app_partner
      data:
        title: "{{ title }}"
        message: "{{ message }}"
        data: { priority: high, ttl: 0, importance: high }
  mode: parallel
