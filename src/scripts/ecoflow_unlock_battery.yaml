ecoflow_unlock_battery:
  alias: "EcoFlow: Unlock Battery (Car Idle)"
  sequence:
    - action: modbus.write_register
      data:
        hub: ecoflow_powerocean
        slave: 1
        address: 533 # 0x0215 System Control Command — Control Method back to 0 (default/self-consumption)
        value: [0, 0]
  mode: single
