# Inside /modbus/ecoflow.yaml

- name: ecoflow_powerocean
  type: tcp
  host: 192.168.0.165
  port: 502
  timeout: 5
  delay: 1
  retries: 3

  sensors:
    # Battery State of Charge (%)
    - name: "EcoFlow Battery SOC"
      slave: 1
      address: 576
      input_type: holding
      data_type: float32
      swap: word
      scale: 1.0
      precision: 1
      device_class: battery
      state_class: measurement

    # Grid Power (Watts: + Import / - Export)
    - name: "EcoFlow Grid Power"
      slave: 1
      address: 596
      input_type: holding
      data_type: float32
      swap: word
      device_class: power
      state_class: measurement

    # Battery Power (Watts: + Charging / - Discharging)
    - name: "EcoFlow Battery Power"
      slave: 1
      address: 586
      input_type: holding
      data_type: float32
      swap: word
      device_class: power
      state_class: measurement

    # Solar Production (Watts)
    - name: "EcoFlow Solar Power"
      slave: 1
      address: 566
      input_type: holding
      data_type: float32
      swap: word
      device_class: power
      state_class: measurement