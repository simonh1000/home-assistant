# Inside your /config/modbus.yaml

- name: ecoflow_powerocean
  type: tcp
  host: 192.168.0.165 # Your inverter IP
  port: 502
  
  sensors:
    # Battery State of Charge (%)
    - name: "EcoFlow Battery SOC"
      slave: 1
      address: 40554
      input_type: holding
      data_type: uint16
      scale: 0.1
      precision: 1
      device_class: battery

    # Battery Power (Watts: + charging / - discharging)
    - name: "EcoFlow Battery Power"
      slave: 1
      address: 40552
      input_type: holding
      data_type: float32
      device_class: power
      state_class: measurement

    # Solar PV Production (Watts)
    - name: "EcoFlow Solar Power"
      slave: 1
      address: 40574
      input_type: holding
      data_type: float32
      device_class: power
      state_class: measurement

    # Grid Import/Export Power (Watts)
    - name: "EcoFlow Grid Power"
      slave: 1
      address: 40596
      input_type: holding
      data_type: float32
      device_class: power
      state_class: measurement