# ======================================================================
# Daily Solar Production
#
# sensor.ecoflow_powerocean_solar_energy is already a live, cumulative
# (state_class: total_increasing) kWh sensor combining both PV strings, so
# it can be wrapped directly in a utility_meter rather than re-derived from
# the per-string power sensors.
# ======================================================================

utility_meter:
  daily_solar_production:
    source: sensor.ecoflow_powerocean_solar_energy
    name: "Daily Solar Production"
    cycle: daily
