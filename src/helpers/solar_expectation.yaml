# ======================================================================
# Solar Today/Tomorrow
# battery_soc_at_daybreak: snapshot of battery state of charge at daybreak (0-100%)
# solar_background_load_kw: assumed background load (kW) for the day
# ======================================================================

input_number:
  battery_soc_at_daybreak:
    name: "Battery SoC at Daybreak"
    icon: mdi:battery-clock
    min: 0
    max: 100
    step: 1
    unit_of_measurement: "%"
  solar_background_load_kw:
    name: "Solar Card: Assumed Background Load"
    icon: mdi:home-lightning-bolt
    min: 0.05
    max: 0.4
    step: 0.05
    initial: 0.20
    unit_of_measurement: "kW"
