# Loads default set of integrations. Do not remove.
default_config:

# Load frontend themes from the themes folder
frontend:
  themes: !include_dir_merge_named themes

# Consolidated automations list generated by combine.py from *.yaml files
automation: !include automations.yaml

# Consolidated scripts dictionary generated by combine.py from *.script.yaml files
script: !include scripts.yaml

# saved snapshots of specific states for multiple devices or entities (like lights, media players, and covers)
# that allow you to restore a precise configuration all at once
scene: !include scenes.yaml

# homeassistant.packages allow a single YAML file to define multiple domains together
homeassistant:
  packages:
    # state for the guardian script (but NOT name-spacing!)
    guardian_state: !include helpers.yaml

# Enable YAML mode for dashboards
lovelace:
  mode: yaml
