title: EV Guardian Status
views:
  - title: Home
    cards:
      - type: entities
        title: Quick Status
        entities:
          - entity: input_boolean.ev_guardian_yielding
            name: Currently Yielding
          - entity: input_boolean.ev_guardian_quiet
            name: House is Quiet
          - entity: sensor.p1_meter_power
            name: Current Load

      - type: markdown
        title: Guardian State Explanation
        content: |-
          ## EV Guardian State
          ### Yielding

            **{{ 'Yes 🟢' if is_state('input_boolean.ev_guardian_yielding', 'on') else 'No' }}**

            Set to Yes when the Guardian has paused the EV because house load crossed **6kW** while the car was charging. Stays Yes until the house has been quiet (see below) for the required minimum period, at which point the automation resumes charging and resets this back to No.


            ### House Quiet

            **{{ 'Yes 🟢' if is_state('input_boolean.ev_guardian_quiet', 'on') else 'No' }}**

            Set to Yes once load has stayed below 500W for 2 continuous minutes while a Yielding pause is active — confirming whatever caused the collision (cooking, an appliance, etc.) has actually finished, not just dipped briefly. Resets to No if load rises above 800W again, so a false "quiet" doesn't let charging resume into a load that's about to spike back up.
           
            ---

           [Check List](http://homeassistant.local:8123/local/checklist.html)

      - type: entities
        title: Deployment Info
        entities:
          - entity: input_text.config_version
            name: Running Version
          - entity: input_text.config_deployed
            name: Deployed At
