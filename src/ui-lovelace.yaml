title: EV Guardian
views:
  - title: Monitoring
    type: sections
    max_columns: 2
    sections:
      - type: grid
        background:
          color: "#90ee90"   # light green
          opacity: 40
        cards:
          - type: heading
            heading: EcoFlow
            icon: mdi:battery-charging
          - type: entities
            entities:
              - entity: switch.ecoflow_powerocean_modbus_control
                name: Modbus Control
              - entity: select.ecoflow_powerocean_battery_mode
                name: Battery Mode

      - type: grid
        background:
          color: "#64b5f6"   # light blue
          opacity: 40
        cards:
          - type: heading
            heading: EV Guardian
            icon: mdi:ev-station
          - type: markdown
            content: |
              {% set st = states('input_select.ev_guardian_state') %}
              ## <font color="{{ 'green' if st == 'idle' else 'orange' }}">{{ st | capitalize }}</font>

              ---

              - **Idle**: EV charging normally or monitoring for spikes.
              - **Cooking**: Paused for the dinner window (18:15 to 20:15), or until you press Done.
              - **Yielding**: Paused because house load crossed **6.0kW**. Stays here until the house is quiet.
              - **Cooldown**: Load has been under 500W for 2 minutes. Waiting for the 10-minute total yielding timer to elapse before resuming.

              ---

              **Click Done after finished cooking to permit car charging.**
          - type: entities
            entities:
              # Short name on purpose: entity-row names truncate on mobile. The longer
              # explanation sits in the markdown card above, which wraps.
              - type: button
                name: Cooking finished
                icon: mdi:stove
                action_name: Done
                tap_action:
                  action: perform-action
                  perform_action: automation.trigger
                  target:
                    entity_id: automation.ev_cooking_over_button
