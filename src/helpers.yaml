#                                                        v
#                                              +-------------------+
#                                              |     YIELDING      |
#                                              +-------------------+
#
# ======================================================================

input_select:
  ev_guardian_state:
    name: "EV Guardian State"
    options:
      - idle
      - cooking
      - yielding
      - cooldown
    icon: mdi:ev-station

input_text:
  config_version:
    name: "Config Version"
    icon: mdi:version
  config_deployed:
    name: "Config Deployed At"
    icon: mdi:clock-outline
