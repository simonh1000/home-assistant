alias: "EV: Deadline Charge - Activate"
description: >
  ON-DEMAND: Fired by pressing the "EV Charge By Tomorrow" helper button.
  Switches the Ohme to deadline/scheduled charging targeting 95% by 07:00 
  the next morning.
triggers:
  - trigger: state
    entity_id: input_boolean.ev_deadline_charge_active
    to: "on"
conditions:
  - condition: not
    conditions:
      - condition: state
        entity_id: sensor.ohme_home_pro_delta_11kw_status
        state: "unplugged"
actions:
  - action: select.select_option
    target:
      entity_id: select.ohme_home_pro_delta_11kw_charge_mode
    data:
      option: smart_charge
  - action: number.set_value
    target:
      entity_id: number.ohme_home_pro_delta_11kw_target_percentage
    data:
      value: 95
  - action: time.set_value
    target:
      entity_id: time.ohme_home_pro_delta_11kw_target_time
    data:
      time: "07:00:00"
  - action: notify.mobile_app_pixel_10
    data:
      title: "EV Deadline Charging Activated"
      message: "Targeting 95% by 07:00 tomorrow. 6.0kW peak guard is now armed."
      data:
        priority: high
        ttl: 0
        importance: high
  - action: notify.mobile_app_pixel_8
    data:
      title: "EV Deadline Charging Activated"
      message: "Targeting 95% by 07:00 tomorrow. 6.0kW peak guard is now armed."
      data:
        priority: high
        ttl: 0
        importance: high
mode: single
